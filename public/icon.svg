<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ícono de Cubos Web: cubo isométrico con los colores del cubo sobre el fondo oscuro.
       Cada cara es una grilla de 3×3 deformada con una matriz (eje "derecha", eje "abajo", origen). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230" />
      <stop offset="1" stop-color="#0e1014" />
    </linearGradient>
    <radialGradient id="brillo" cx="0.5" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#3d8bff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#3d8bff" stop-opacity="0" />
    </radialGradient>
    <!-- 9 stickers en coordenadas de la cara (0 a 3) -->
    <g id="grilla">
      <rect x="0" y="0" width="3" height="3" rx="0.22" fill="#07090c" />
      <rect x="0.1" y="0.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="1.1" y="0.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="2.1" y="0.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="0.1" y="1.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="1.1" y="1.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="2.1" y="1.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="0.1" y="2.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="1.1" y="2.1" width="0.8" height="0.8" rx="0.16" />
      <rect x="2.1" y="2.1" width="0.8" height="0.8" rx="0.16" />
    </g>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)" />
  <rect width="512" height="512" rx="112" fill="url(#brillo)" />

  <!-- Cubo centrado en (256, 256): vértices arriba (256,84), costados (405,170)/(107,170), abajo (256,428) -->
  <g stroke="none">
    <!-- Cara de arriba: amarilla -->
    <use href="#grilla" fill="#ffd500" transform="matrix(49.667 -28.667 49.667 28.667 107 170)" />
    <!-- Cara izquierda (frente): verde -->
    <use href="#grilla" fill="#2ec27e" transform="matrix(49.667 28.667 0 57.333 107 170)" />
    <!-- Cara derecha: roja, un poco más oscura para dar volumen -->
    <use href="#grilla" fill="#ff4d5e" transform="matrix(49.667 -28.667 0 57.333 256 256)" />
    <use href="#grilla" fill="#000" opacity="0.14" transform="matrix(49.667 -28.667 0 57.333 256 256)" />
  </g>
  <!-- Detalle: un sticker de cada uno de los otros colores en las esquinas del frente -->
  <g transform="matrix(49.667 28.667 0 57.333 107 170)">
    <rect x="0.1" y="2.1" width="0.8" height="0.8" rx="0.16" fill="#3d8bff" />
  </g>
  <g transform="matrix(49.667 -28.667 0 57.333 256 256)">
    <rect x="2.1" y="2.1" width="0.8" height="0.8" rx="0.16" fill="#ff8a00" />
  </g>
  <g transform="matrix(49.667 -28.667 49.667 28.667 107 170)">
    <rect x="2.1" y="2.1" width="0.8" height="0.8" rx="0.16" fill="#f2f2f2" />
  </g>
</svg>
