<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <meta name="description" content="Timer de speedcubing con scrambles oficiales y estadísticas." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Cubos · Timer</title>
  </head>
  <body>
    <header class="topbar fadeable">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <h1>Cubos</h1>
      </div>
      <nav class="events" id="events" aria-label="Categoría"></nav>
    </header>

    <main class="layout">
      <section class="practice">
        <div class="scramble-card fadeable" id="scramble-card">
          <div class="scramble-main">
            <p class="scramble" id="scramble" aria-live="polite">Generando scramble...</p>
            <button class="icon-btn" id="new-scramble" type="button" title="Nuevo scramble" aria-label="Nuevo scramble">
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
          <div class="scramble-view" id="scramble-view"></div>
        </div>

        <div class="timer-zone" id="timer-zone">
          <div class="pb-badge" id="pb-badge" aria-hidden="true">¡Nuevo PB!</div>
          <div class="timer" id="timer" role="timer" aria-live="off">0.00</div>
          <p class="hint fadeable" id="hint"></p>
        </div>
      </section>

      <aside class="session fadeable" aria-label="Sesión">
        <div class="stats" id="stats">
          <div class="stat stat-best"><span>Mejor</span><strong id="stat-best">-</strong></div>
          <div class="stat stat-ao5"><span>ao5</span><strong id="stat-ao5">-</strong></div>
          <div class="stat stat-ao12"><span>ao12</span><strong id="stat-ao12">-</strong></div>
          <div class="stat stat-count"><span>Tiempos</span><strong id="stat-count">0</strong></div>
        </div>
        <div class="session-head">
          <h2>Tiempos</h2>
          <button class="text-btn danger" id="clear-session" type="button">Borrar sesión</button>
        </div>
        <ol class="solves" id="solves"></ol>
        <p class="empty" id="empty">Todavía no hay tiempos en esta categoría.</p>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
